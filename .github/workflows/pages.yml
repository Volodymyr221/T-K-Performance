# Публікація сайту на GitHub Pages.
#
# Крок `configure-pages` з `enablement: true` вмикає Pages сам — тому
# нічого натискати в налаштуваннях репозиторію не треба.
#
# Спрацьовує на кожен пуш у `main`, і вручну — кнопкою «Run workflow».

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новий пуш скасовує попередній, ще не завершений
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Викладаємо ТІЛЬКИ файли сайту. Інакше на публічну адресу
      # потрапили б CLAUDE.md, NOW.md і журнали сесій — внутрішні
      # нотатки на сайті клієнта.
      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html robots.txt sitemap.xml .nojekyll _site/
          cp -r assets _site/
          echo "— що виклали —"
          find _site -type f | sort

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
