<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>T&amp;K Workshop Desk</title>

<!--
  Внутрішня система T&K Performance.

  🛑 Зараз працює на ВИГАДАНИХ даних (js/mock.js) — бази ще немає.
  Жодного реального клієнта тут нема і бути не може.

  noindex вище — щоб пошуковики не тягли адмінку у видачу.

  Шрифти беруться з сайту (../../assets/fonts/) — той самий Archivo,
  та сама Manrope для кирилиці. Нових шрифтів не додано.
-->

<style>
  /* Ті самі файли шрифтів, що й на сайті. Archivo не має кирилиці —
     українську підхоплює Manrope через unicode-range, рівно як там. */
  @font-face{
    font-family:'Archivo'; font-style:normal; font-weight:400 800;
    font-stretch:75% 125%; font-display:swap;
    src:url('../../assets/fonts/archivo-latin-400_800.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Manrope'; font-style:normal; font-weight:400 800; font-display:swap;
    src:url('../../assets/fonts/manrope-cyrillic-400_800.woff2') format('woff2');
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
  }
  @font-face{
    font-family:'Manrope'; font-style:normal; font-weight:400 800; font-display:swap;
    src:url('../../assets/fonts/manrope-cyrillic-ext-400_800.woff2') format('woff2');
    unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F;
  }
  @font-face{
    font-family:'JetBrains Mono'; font-style:normal; font-weight:500; font-display:swap;
    src:url('../../assets/fonts/jetbrains-mono-latin-500.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  /* Кирилиця для моно теж потрібна: підпис «УКР» на перемикачі мови
     набраний саме ним, і без цього файлу браузер підмінив би шрифт. */
  @font-face{
    font-family:'JetBrains Mono'; font-style:normal; font-weight:500; font-display:swap;
    src:url('../../assets/fonts/jetbrains-mono-cyrillic-500.woff2') format('woff2');
    unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
  }
</style>
<link rel="icon" href="../../assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>

<body>
  <div class="shell">
    <nav class="side" id="side" aria-label="Меню"></nav>

    <div class="main">
      <header class="top">
        <h1 id="title">Сьогодні</h1>
        <span class="sub" id="sub"></span>
        <span class="spacer"></span>
        <div id="tools"></div>
      </header>
      <div class="scroll" id="scroll"></div>
    </div>
  </div>

  <!-- Нижнє меню зʼявляється тільки на телефоні: бічна колонка там ховається -->
  <nav class="tabs" id="tabs" aria-label="Меню"></nav>

  <script src="js/mock.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
